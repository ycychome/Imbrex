name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install the ACP process subreaper
        run: |
          curl -fsSL https://github.com/krallin/tini/releases/download/v0.19.0/tini-static-amd64 -o /tmp/tini
          echo "c5b0666b4cb676901f90dfcb37106783c5fe2077b04590973b885950611b30ee  /tmp/tini" | sha256sum -c -
          sudo install -m 755 /tmp/tini /usr/local/bin/tini
      - run: npm run check
