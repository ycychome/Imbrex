name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install the ACP process subreaper
        run: |
          curl -fsSL https://github.com/krallin/tini/releases/download/v0.19.0/tini-static-amd64 -o /tmp/tini
          echo "c5b0666b4cb676901f90dfcb37106783c5fe2077b04590973b885950611b30ee  /tmp/tini" | sha256sum -c -
          sudo install -m 755 /tmp/tini /usr/local/bin/tini
      - run: npm run check
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    services:
      neo4j:
        image: neo4j:5.26.24-community@sha256:f66304b9511c60d33555a2c451f88e03d82d1ebc893f32d84c98a6b326096435
        env:
          NEO4J_AUTH: neo4j/integration-only-password
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 40
    env:
      GRAPHITI_TELEMETRY_ENABLED: 'false'
      MEMORY_NEO4J_URI: bolt://neo4j:7687
      MEMORY_NEO4J_PASSWORD: integration-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --no-cache-dir uv==0.13.4
      - run: uv sync --frozen --project services/memory
      - run: uv run --project services/memory ruff check services/memory
      - run: uv run --project services/memory mypy --config-file services/memory/pyproject.toml services/memory/src
      - run: uv run --project services/memory pytest services/memory/tests -m 'not integration'
      - run: uv run --project services/memory pytest services/memory/tests -m integration
        env:
          MEMORY_INTEGRATION: '1'
